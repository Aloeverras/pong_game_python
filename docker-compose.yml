services:
  devcontainer:
    image: python_game_devcontainer:1.0.0.0
    tty : true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME : "${USERNAME}"
        USERID : "${USERID}"
        GROUPNAME : "${GROUPNAME}"
        GROUPID : "${GROUPID}"
        PACKAGES : " git python3 python3-pip python3-venv build-essential python3-dev libffi-dev "
    volumes:
      - .:/workspace    